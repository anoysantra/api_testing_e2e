name: API Testing CI Suite

on:
  push:
    branches: [ "codespace-reimagined-lamp-6x64wj65jqf4x6r" ]
  pull_request:
    branches: [ "codespace-reimagined-lamp-6x64wj65jqf4x6r" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run test suite and generate HTML report
      run: |
        mkdir -p reports
        pytest -q --html=reports/report.html --self-contained-html
      continue-on-error: true

    - name: Upload Generated Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: pytest-execution-report
        path: reports/
        if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t api-testing-suite:latest .
