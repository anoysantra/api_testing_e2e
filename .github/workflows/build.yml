name: API Testing CI Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # We use "continue-on-error" so that if a test fails, 
    # GitHub Actions will still upload your logs instead of instantly failing.
    - name: Run test suite with pytest
      run: pytest -q
      continue-on-error: true

    # Step to extract logs and test reports out of the runner environment
    - name: Upload Test Logs and Reports Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-artifacts
        path: |
          logs/
          reports/
        if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t api-testing-suite:latest .

